<script>
// 設定画面の「プッシュ通知」カード
async function pushSettingsCard() {
  const status = el("p", { class: "sub", style: "line-height:1.7" }, "");
  const toggle = el("button", { class: "btn big" }, "");
  const test = el("button", { class: "btn ghost big" }, "テスト通知を送る");
  let on = false;
  const isIos = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;

  async function refresh() {
    if (!pushSupported()) {
      toggle.style.display = test.style.display = "none";
      status.textContent = isIos && !standalone
        ? "iPhoneでは、Safariの共有ボタンから「ホーム画面に追加」して、そのアイコンから開くと通知が使えます。"
        : "このブラウザはプッシュ通知に対応していません。";
      return;
    }
    const sub = await currentSub().catch(() => null);
    on = !!sub && Notification.permission === "granted";
    toggle.style.display = "";
    test.style.display = on ? "" : "none";
    toggle.textContent = on ? "通知をオフにする" : "通知をオンにする";
    toggle.className = "btn big" + (on ? " ghost" : "");
    status.textContent = Notification.permission === "denied"
      ? "通知がブロックされています。端末の設定でこのアプリの通知を許可してください。"
      : on ? "オン：投稿・コメント・フレンド申請などをお知らせします。"
           : "オフ：アプリを閉じているときに通知が届きません。";
  }
  toggle.onclick = async () => {
    toggle.disabled = true;
    try {
      if (on) { await disablePush(); toast("通知をオフにしました"); }
      else { await enablePush(); toast("通知をオンにしました"); }
    } catch (e) {
      console.error(e);
      toast(String(e.message) === "denied" ? "通知が許可されませんでした" : "うまくいきませんでした：" + (e.message || e));
    }
    toggle.disabled = false;
    await refresh();
  };
  test.onclick = async () => {
    test.disabled = true;
    const { error } = await sb.rpc("send_test_notification");
    toast(error ? "送れませんでした" : "送りました。数秒待ってください");
    setTimeout(() => { test.disabled = false; }, 3000);
  };
  await refresh();
  return el("div", { class: "card" }, el("h2", {}, "プッシュ通知"), status, toggle, test);
}

const $ = (s, r = document) => r.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
function toast(msg) {
  const t = el("div", { class: "toast" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
function fmt(d) {
  d = new Date(d);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 選んだ写真を、正方形・小さく（約160px）して文字データにする
function photoToAvatar(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight), out = 160;
      const c = document.createElement("canvas");
      c.width = c.height = out;
      c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, out, out);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

function pwInput(placeholder, autocomplete = "off") {
  return el("input", {
    type: "password", inputmode: "numeric", maxlength: 6, placeholder, autocomplete,
    oninput: e => { e.target.value = e.target.value.replace(/\D/g, ""); }
  });
}

// fields: [{label, max, placeholder, value, type, inputmode, digits}]
// validate(vals) が文字列を返したらエラー表示して閉じない
function askForm(title, fields, okLabel = "OK", validate) {
  return new Promise(resolve => {
    const inputs = fields.map(f => el("input", {
      type: f.type || "text", inputmode: f.inputmode, maxlength: f.max || 30,
      placeholder: f.placeholder || "", value: f.value || "", autocomplete: "off",
      autocapitalize: "none", autocorrect: "off", spellcheck: "false",
      oninput: f.digits ? (e => { e.target.value = e.target.value.replace(/\D/g, ""); }) : null
    }));
    let overlay;
    const close = val => { overlay.remove(); resolve(val); };
    const form = el("form", {
      class: "modal",
      onsubmit: e => {
        e.preventDefault();
        const vals = inputs.map(i => i.value.trim());
        if (vals.some(v => !v)) { toast("入力してください"); return; }
        const err = validate && validate(vals);
        if (err) { toast(err); return; }
        close(vals);
      }
    },
      el("h2", {}, title),
      fields.map((f, i) => el("label", {}, f.label, inputs[i])),
      el("div", { class: "row" },
        el("button", { type: "button", class: "btn ghost", onclick: () => close(null) }, "キャンセル"),
        el("button", { type: "submit", class: "btn" }, okLabel))
    );
    overlay = el("div", { class: "overlay" }, form);
    document.body.append(overlay);
    inputs[0].focus();
  });
}

const gearLink = () => el("a", { class: "icon", href: "#/settings", title: "設定", style: "font-size:22px" }, "⚙");

// ====== Supabase / ログイン状態 ======

const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: "pasha-main-auth", persistSession: true, autoRefreshToken: true } }) : null;
let me = null;        // ログイン中のユーザー
let profile = null;   // {user_id, login_id, display_name, is_admin}
let refreshHook = null;
let quietSignOut = false;
let routeSeq = 0;
let showLogin = false;   // 招待リンクの画面で「ログインする」を選んだか
const isGuest = () => !!(profile && profile.is_guest);

if (sb) {
  sb.auth.onAuthStateChange(event => {
    if (event === "SIGNED_OUT" && !quietSignOut) {
      me = null; profile = null;
      setTimeout(route, 0);

}

async function loadSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  const bad = async () => {
    quietSignOut = true;
    try { await sb.auth.signOut(); } finally { quietSignOut = false; }

  };
  const { data: p } = await sb.from("profiles").select("*").eq("user_id", session.user.id).maybeSingle();
  if (!p) return await bad();
  me = session.user; profile = p;
  return true;
}

async function doLogin(id, pw) {
  const { error } = await sb.auth.signInWithPassword({ email: toEmail(id), password: pw });
  if (error) throw error;
}
async function doRegister(id, name, pw) {
  const { data, error } = await sb.auth.signUp({ email: toEmail(id), password: pw, options: { data: { display_name: name } } });
  if (error) throw error;
  if (!data.session) throw new Error("CONFIRM_ON");
}
function authMessage(err) {
  const m = String((err && err.message) || err);
  if (m === "CONFIRM_ON") return "設定が足りません：Supabaseの「Confirm email」をOFFにしてください";
  if (/Invalid login credentials/i.test(m)) return "IDかパスワードが違います";
  if (/already registered|already been registered|user_already_exists/i.test(m)) return "このIDはもう登録されています。ログインしてください";
  if (/Database error/i.test(m)) return "このIDは発行されていません。管理者に確認してください";
  if (/rate limit|too many/i.test(m)) return "試行回数が多すぎます。少し待ってからやり直してください";
  if (/[ぁ-んァ-ヶ一-龥]/.test(m)) return m;
  return "うまくいきませんでした：" + m;
}

// ====== ルーター ======
async function route() {
  const my = ++routeSeq;
  refreshHook = null;
  if (window.__camClose) window.__camClose();
  const root = el("div");
  let refresh;
  if (!configured) {
    root.append(topbar(APP_NAME), el("main", { class: "wrap" }, el("p", { class: "empty" }, "まだ設定が終わっていません。")));
  } else {
    try {
      if (!(me && profile)) {
        const ok = await loadSession();
        if (my !== routeSeq) return;
        if (!ok) { me = null; profile = null; }
      }
      if (!(me && profile)) {
        const jm = (location.hash || "").match(/^#\/join\/(.+)$/);
        if (jm && !showLogin) guestJoinPage(root, jm[1]); else loginPage(root);
      } else {
        if (!profile.is_admin && !pushSynced && (!profile.reg_status || profile.reg_status === "approved")) { pushSynced = true; syncPush(); }
        const hash = location.hash || "#/";
        let m;
        if (!profile.is_admin && profile.reg_status && profile.reg_status !== "approved") pendingPage(root);
        else if (hash === "#/settings") refresh = await settingsPage(root);
        else if (profile.is_admin) refresh = await adminNoticePage(root);
        else if (isGuest() && (hash === "#/friends" || hash === "#/rejected")) { await homePage(root); refresh = () => route(); }
        else if (hash === "#/friends") refresh = await friendsPage(root);
        else if (hash === "#/notifications") refresh = await notificationsPage(root);
        else if (hash === "#/rejected") refresh = await rejectedPage(root);
        else if ((m = hash.match(/^#\/join\/(.+)$/))) refresh = await joinPage(root, m[1]);
        else if ((m = hash.match(/^#\/g\/([0-9a-fA-F-]+)$/))) refresh = await groupPage(root, m[1]);
        else { await homePage(root); refresh = () => route(); }
      }
    } catch (e) {
      console.error(e);
      root.replaceChildren(topbar(APP_NAME), el("main", { class: "wrap" },
        el("p", { class: "empty" }, "うまく読み込めませんでした。", el("br"), String(e.message || e)),
        el("button", { class: "btn big", onclick: () => location.reload() }, "再読み込み")));
    }
  }
  if (my !== routeSeq) return;
  $("#app").replaceChildren(root);
  refreshHook = refresh || null;
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (!document.hidden && refreshHook) refreshHook(); });

// ====== プッシュ通知 ======
function urlB64ToUint8(b64) {
  const pad = "=".repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
function pushSupported() {
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}
// サービスワーカーが使えない環境でも画面が固まらないよう、待つのは4秒まで
function swReady() {
  return Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error("sw-timeout")), 4000))]);
}
async function currentSub() {
  if (!pushSupported()) return null;
  try { const reg = await swReady(); return await reg.pushManager.getSubscription(); }
  catch (_) { return null; }
}
async function saveSub(sub) {
  const j = sub.toJSON();
  const { error } = await sb.rpc("save_push_subscription", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (error) throw error;
}
async function enablePush() {
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("denied");
  const reg = await swReady();
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(VAPID_PUBLIC_KEY) });
  await saveSub(sub);
}
async function disablePush() {
  const sub = await currentSub();
  if (sub) {
    await sb.rpc("delete_push_subscription", { p_endpoint: sub.endpoint }).catch(() => {});
    await sub.unsubscribe().catch(() => {});
  }
}
// すでにオンの人は、起動のたびに宛先を最新にしておく
async function syncPush() {
  try {
    if (!pushSupported() || Notification.permission !== "granted") return;
    const reg = await swReady();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(VAPID_PUBLIC_KEY) });
    await saveSub(sub);
  } catch (_) {}
}
let pushSynced = false;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("message", e => {
    if (e.data && e.data.type === "nav" && typeof e.data.hash === "string") {
      if (location.hash === e.data.hash) route(); else location.hash = e.data.hash;
    }
  });
}

// ====== アプリロック（4桁・6桁の番号、指紋・顔認証） ======
const LOCK_KEY = "pasha-lock", LOCK_T = "pasha-lock-t";
const LOCK_DELAYS = [[0, "すぐ"], [60, "1分後"], [300, "5分後"], [1800, "30分後"], [3600, "1時間後"]];
function lockCfg() { try { return JSON.parse(localStorage.getItem(LOCK_KEY) || "null"); } catch (_) { return null; } }
function saveLock(c) { try { if (c) localStorage.setItem(LOCK_KEY, JSON.stringify(c)); else localStorage.removeItem(LOCK_KEY); } catch (_) {} }
function touchLockTime() { try { localStorage.setItem(LOCK_T, String(Date.now())); } catch (_) {} }
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function pinHash(pin, salt) {
  return toHex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pin)));
}
async function bioAvailable() {
  try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch (_) { return false; }
}
async function bioRegister() {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: rnd(32), rp: { name: "ぱしゃっと" },
    user: { id: rnd(16), name: (profile && profile.login_id) || "user", displayName: (profile && profile.display_name) || "user" },
    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }, timeout: 60000 } });
  return b64(cred.rawId);
}
async function bioCheck(id) {
  await navigator.credentials.get({ publicKey: {
    challenge: rnd(32), allowCredentials: [{ type: "public-key", id: unb64(id) }], userVerification: "required", timeout: 60000 } });
  return true;
}

// 数字キーパッド（番号がそろったら onDone(番号) を呼ぶ）
function pinPad(len, onDone, bioBtn) {
  let val = "";
  const dots = el("div", { class: "dots" });
  const msg = el("div", { class: "msg" });
  const pad = el("div", { class: "pad" });
  let busy = false;
  function draw() { dots.replaceChildren(...Array.from({ length: len }, (_, i) => el("i", { class: i < val.length ? "on" : "" }))); }
  async function push(d) {
    if (busy || val.length >= len) return;
    val += d; draw();
    if (val.length === len) {
      busy = true;
      const v = val;
      try { await onDone(v); } finally { val = ""; busy = false; draw(); }
    }
  }
  pad.replaceChildren(
    ...[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => el("button", { type: "button", onclick: () => push(String(n)) }, String(n))),
    bioBtn || el("button", { type: "button", class: "ghost", disabled: true }, ""),
    el("button", { type: "button", onclick: () => push("0") }, "0"),
    el("button", { type: "button", class: "ghost", onclick: () => { if (!busy) { val = val.slice(0, -1); draw(); } } }, "⌫"));
  draw();
  return { dots, msg, pad };
}

// 番号を入力してもらうダイアログ（設定画面用）。キャンセルは null
function askPin(title, len) {
  return new Promise(resolve => {
    let overlay;
    const done = v => { overlay.remove(); resolve(v); };
    const pp = pinPad(len, v => done(v));
    overlay = el("div", { class: "overlay" }, el("div", { class: "modal", style: "display:flex;flex-direction:column;align-items:center;gap:14px" },
      el("h2", {}, title), pp.dots, pp.pad,
      el("button", { class: "btn ghost", onclick: () => done(null) }, "キャンセル")));
    document.body.append(overlay);
  });
}

let lockEl = null, lockFails = 0, lockUntil = 0;
function showLock() {
  const cfg = lockCfg();
  if (!cfg || lockEl) return;
  const title = el("h2", {}, "ロック中");
  let bioBtn = null;
  async function tryBio() {
    try { await bioCheck(cfg.bio); unlock(); } catch (_) {}
  }
  if (cfg.bio) bioBtn = el("button", { type: "button", class: "ghost", onclick: tryBio, title: "指紋・顔認証" }, "🔓");
  const pp = pinPad(cfg.len, async v => {
    if (Date.now() < lockUntil) { pp.msg.textContent = "しばらく待ってからやり直してください"; return; }
    if (await pinHash(v, cfg.salt) === cfg.hash) { unlock(); return; }
    lockFails++;
    if (lockFails >= 5) { lockFails = 0; lockUntil = Date.now() + 30000; pp.msg.textContent = "5回まちがえました。30秒待ってください"; }
    else pp.msg.textContent = "番号がちがいます";
  }, bioBtn);
  function unlock() {
    lockFails = 0;
    if (lockEl) { lockEl.remove(); lockEl = null; }
    touchLockTime();
  }
  lockEl = el("div", { class: "lock" }, el("div", { style: "font-size:44px" }, "🔒"), title,
    el("div", { class: "sub" }, cfg.bio ? "番号か、指紋・顔認証で開きます" : "ロック番号を入れてください"),
    pp.dots, pp.msg, pp.pad,
    el("button", { class: "btn ghost", style: "font-size:13px", onclick: async () => {
      if (!confirm("ロック番号を忘れた場合は、ログアウトして解除します。\nもう一度ログインが必要です。ログアウトしますか？")) return;
      await logout();
      if (lockEl) { lockEl.remove(); lockEl = null; }
    } }, "番号を忘れた（ログアウトして解除）"));
  document.body.append(lockEl);
  if (cfg.bio) tryBio();
}
function maybeLock() {
  const c = lockCfg();
  if (!c || lockEl) return;
  const last = Number(localStorage.getItem(LOCK_T)) || 0;
  if (Date.now() - last >= c.delay * 1000) showLock();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) touchLockTime(); else maybeLock(); });

          if (await pinHash(old, cfg.salt) !== cfg.hash) { toast("番号がちがいます"); return; }
          const len = cfg.len === 4 ? 6 : 4;
          const useLen = confirm(`新しい番号は${len}桁にしますか？\nOK：${len}桁　／　キャンセル：${cfg.len}桁のまま`) ? len : cfg.len;
          const a = await askPin("新しいロック番号", useLen); if (a === null) return;
          const b = await askPin("もう一度入れてください", useLen); if (b === null) return;
          if (a !== b) { toast("番号が一致しません"); return; }
          const salt = toHex(rnd(8));
          saveLock({ ...cfg, ...lockCfg(), len: useLen, salt, hash: await pinHash(a, salt) });
          toast("ロック番号を変えました"); draw();

        el("button", { class: "btn ghost big", onclick: async () => {

      el("div", { class: "sub" }, "名前の横や、投稿に表示されます"));
    photoBtns.replaceChildren(

  draw();

      const [a, b] = await Promise.all([

// ====== フレンド ======
async function friendsPage(root) {
  const body = el("div");
  const idIn = el("input", { type: "text", maxlength: 20, placeholder: "友達のID", autocapitalize: "none", autocorrect: "off", spellcheck: "false" });

  async function call(fn, okMsg) {
    const { data, error } = await fn();
    if (error) { toast(error.message); return null; }
    if (okMsg) toast(okMsg);
    await load();
    return data;
  }
  async function send() {
    const id = normId(idIn.value);
    if (!ID_RE.test(id)) { toast("IDを入れてください（英小文字・数字・_）"); return; }
    const { data, error } = await sb.rpc("send_friend_request", { p_login_id: id });
    if (error) { toast(error.message); return; }
    idIn.value = "";
    toast({
      sent: "フレンド申請を送りました",
      accepted: "相手からも申請が来ていたので、フレンドになりました",
      already_friends: "もうフレンドです",
      already_pending: "もう申請を送っています"
    }[data] || "完了しました");
    load();
  }

  async function load() {
    const [fr, bl, pr] = await Promise.all([
      sb.from("friendships").select("*"),
      sb.from("blocks").select("*"),
      sb.from("profiles").select("user_id,login_id,display_name,is_admin,is_guest,avatar,avatar_color,avatar_photo")
    ]);
    if (fr.error) { body.replaceChildren(el("p", { class: "empty" }, "読み込めませんでした：" + fr.error.message)); return; }
    const prof = Object.fromEntries((pr.data || []).map(p => [p.user_id, p]));
    const other = f => (f.requester_id === me.id ? f.addressee_id : f.requester_id);
    const incoming = (fr.data || []).filter(f => f.status === "pending" && f.addressee_id === me.id);
    const outgoing = (fr.data || []).filter(f => f.status === "pending" && f.requester_id === me.id);
    const friends = (fr.data || []).filter(f => f.status === "accepted");
    const blocked = bl.data || [];

    const person = id => {
      const p = prof[id];
      return el("div", { class: "who2 wa" }, avatarEl(p || { display_name: "？" }, "sm"), el("span", {}, el("b", {}, p ? p.display_name : "？"), " ", el("small", {}, p ? "@" + p.login_id : "")));
    };
    const row = (id, ...btns) => el("div", { class: "rowi" }, person(id), el("div", { class: "ops" }, ...btns));
    const name = id => (prof[id] ? prof[id].display_name : "この人");
    const doBlock = id => {
      if (!confirm(`${name(id)} さんをブロックしますか？\nフレンドから外れ、お互いに申請やグループへの追加ができなくなります。`)) return;
      call(() => sb.rpc("block_user", { p_user: id }), "ブロックしました");
    };

    const kids = [];
    kids.push(el("div", { class: "sect" }, `届いた申請${incoming.length ? "（" + incoming.length + "）" : ""}`));
    kids.push(incoming.length
      ? el("div", { class: "rows" }, incoming.map(f => row(f.requester_id,
          el("button", { class: "btn sm", onclick: () => call(() => sb.rpc("respond_friend_request", { p_id: f.id, p_accept: true }), "フレンドになりました") }, "許可"),
          el("button", { class: "btn ghost sm", onclick: () => call(() => sb.rpc("respond_friend_request", { p_id: f.id, p_accept: false }), "拒否しました") }, "拒否"),
          el("button", { class: "btn danger sm", onclick: () => doBlock(f.requester_id) }, "ブロック"))))
      : el("p", { class: "note", style: "margin-top:4px" }, "届いている申請はありません。"));

    kids.push(el("div", { class: "sect" }, "フレンド"));
    kids.push(friends.length
      ? el("div", { class: "rows" }, friends.map(f => row(other(f),
          el("button", { class: "btn ghost sm", onclick: () => { if (confirm(`${name(other(f))} さんをフレンドから外しますか？`)) call(() => sb.rpc("remove_friendship", { p_user: other(f) }), "フレンドを解除しました"); } }, "解除"),
          el("button", { class: "btn danger sm", onclick: () => doBlock(other(f)) }, "ブロック"))))
      : el("p", { class: "note", style: "margin-top:4px" }, "まだフレンドがいません。上でIDを入れて申請しよう。"));

    if (outgoing.length) {
      kids.push(el("div", { class: "sect" }, "送った申請（返事待ち）"));
      kids.push(el("div", { class: "rows" }, outgoing.map(f => row(f.addressee_id,
        el("button", { class: "btn ghost sm", onclick: () => call(() => sb.rpc("remove_friendship", { p_user: f.addressee_id }), "取り消しました") }, "取り消し")))));
    }
    if (blocked.length) {
      kids.push(el("div", { class: "sect" }, "ブロック中"));
      kids.push(el("div", { class: "rows" }, blocked.map(b => row(b.blocked_id,
        el("button", { class: "btn ghost sm", onclick: () => call(() => sb.rpc("unblock_user", { p_user: b.blocked_id }), "ブロックを解除しました") }, "解除")))));
    }
    body.replaceChildren(...kids);
  }

  root.append(topbar("フレンド", { back: true }), el("main", { class: "wrap" },
    el("div", { class: "card" },
      el("h2", {}, "フレンドを追加"),
      el("div", { class: "addrow" }, el("label", { style: "flex:1;margin:0" }, "相手のID", idIn), el("button", { class: "btn", onclick: send }, "申請")),
      el("p", { class: "note" }, "相手が許可すると、フレンドになります。フレンドになった人を、グループに追加できます。")),
    body));
  await load();
  return load;
}

  const friendsLink = isGuest() ? null : el("a", { class: "icon", href: "#/friends", title: "フレンド", style: "font-size:22px" }, "👫", pending ? el("span", { class: "badge" }, pending) : null);
  const card = (g, cls) => el("a", { class: "gcard" + (cls ? " " + cls : ""), href: "#/g/" + g.id }, el("span", { class: "gname" }, g.name), el("span", { class: "chev" }, "›"));
  root.append(
    topbar(APP_NAME, { actions: [bellLink, ...(friendsLink ? [friendsLink] : []), gearLink()] }),
    el("main", { class: "wrap" },
      installTip(),
      active.length
        ? el("div", { class: "glist" }, active.map(g => card(g)))
        : el("p", { class: "empty" }, "まだグループがありません。", el("br"), isGuest() ? "招待リンクを開くと、グループに参加できます。" : "グループを作って、友達を招待しよう！"),
      isGuest() ? null : el("button", { class: "btn big", onclick: createGroup }, "＋ グループを作る"),
      archived.length ? el("details", { class: "arch" }, el("summary", {}, `アーカイブ済み（${archived.length}）`), el("div", { class: "glist" }, archived.map(g => card(g, "arc")))) : null
    )
  );
}

async function createGroup() {

// ====== グループ（フィード） ======
async function inviteShare(group) {
  const url = `${location.origin}${location.pathname}#/join/${group.invite_code}`;
  const text = `「${group.name}」に参加してね📷`;
  if (navigator.share) {
    try { await navigator.share({ title: APP_NAME, text, url }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("招待リンクをコピーしました"); }
  catch { prompt("招待リンク", url); }
}

async function groupPage(root, gid) {
  const [gr, mr, pr, fr] = await Promise.all([
    sb.from("groups").select("*").eq("id", gid).maybeSingle(),
    sb.from("members").select("user_id").eq("group_id", gid),
    sb.from("profiles").select("user_id,login_id,display_name,is_admin,is_guest,avatar,avatar_color,avatar_photo"),
    sb.from("friendships").select("requester_id,addressee_id,status")
  ]);
  const frOther = f => (f.requester_id === me.id ? f.addressee_id : f.requester_id);
  const friendIds = new Set((fr.data || []).filter(f => f.status === "accepted").map(frOther));
  const pendingIds = new Set((fr.data || []).filter(f => f.status === "pending").map(frOther));
  const group = gr.data;
  if (gr.error || !group) {
    root.append(topbar(APP_NAME, { back: true }), el("main", { class: "wrap" },
      el("p", { class: "empty" }, "このグループが見つからないか、参加していません。"),
      el("a", { class: "btn big", href: "#/" }, "ホームへ")));
    return;
  }
  const profiles = pr.data || [];
  const names = Object.fromEntries(profiles.map(p => [p.user_id, p.display_name]));
  const profs = Object.fromEntries(profiles.map(p => [p.user_id, p]));
  const memberIds = new Set((mr.data || []).map(m => m.user_id));
  const isOwner = group.owner_id === me.id;
  const archived = !!group.archived;
  let limit = 20;
  const feed = el("div", { class: "feed" });

  async function loadFeed() {
    const { data: rows, error } = await sb.from("posts").select("*").eq("group_id", gid)
      .order("taken_at", { ascending: false }).limit(limit + 1);
    if (error) { console.error(error); toast("読み込みに失敗しました"); return; }
    const more = rows.length > limit;
    const posts = rows.slice(0, limit);
    let comments = [];
    const urls = {};
    if (posts.length) {
      const [c, s] = await Promise.all([
        sb.from("comments").select("*").in("post_id", posts.map(p => p.id)).order("created_at"),
        sb.storage.from("media").createSignedUrls(posts.map(p => p.media_path), 3600)
      ]);
      comments = c.data || [];
      (s.data || []).forEach(x => { if (x.path && x.signedUrl) urls[x.path] = x.signedUrl; });
    }
    if (!posts.length) {
      feed.replaceChildren(el("p", { class: "empty" }, archived ? "投稿はありません。" : "まだ投稿がありません。", archived ? null : [el("br"), "下のカメラボタンで最初の1枚を撮ろう📷"]));
      return;
    }
    const ctx = { names, profs, isOwner, archived, guest: isGuest(), reload: loadFeed };
    feed.replaceChildren(
      ...posts.map(p => postCard(p, comments.filter(c => c.post_id === p.id), urls[p.media_path], ctx)),
      ...(more ? [el("button", { class: "btn ghost", onclick: () => { limit += 20; loadFeed(); } }, "もっと見る")] : [])
    );
  }

  // メンバー・友達追加・アーカイブのシート
  function openMembers() {
    let overlay;
    const body = el("div", { class: "modal" });
    async function addFriend(p) {
      const { error } = await sb.rpc("add_member", { p_gid: gid, p_user: p.user_id });
      if (error) { toast(error.message); return; }
      memberIds.add(p.user_id);
      toast(`${p.display_name} さんを追加しました`);
      render();
    }
    async function friendReq(id) {
      const { data, error } = await sb.rpc("send_friend_request_to", { p_user: id });
      if (error) { toast(error.message); return; }
      if (data === "accepted") friendIds.add(id); else pendingIds.add(id);
      toast(data === "accepted" ? "フレンドになりました" : "フレンド申請を送りました");
      render();
    }
    async function rejectGroup() {
      if (!confirm(`「${group.name}」を拒否して抜けますか？\n・グループから抜けます\n・今後、招待リンクやフレンドからも追加されなくなります\n・あとから「設定」の「拒否中のグループ」で取り消せます`)) return;
      const { error } = await sb.rpc("reject_group", { p_gid: gid });
      if (error) { toast(error.message); return; }
      overlay.remove();
      toast("拒否しました");
      location.hash = "#/";
    }
    async function toggleArchive() {
      const next = !archived;
      const msg = next
        ? "このグループをアーカイブしますか？\n・新しい投稿やコメントはできなくなります\n・投稿やコメントを削除できるのは、グループを作った人だけになります\n（あとで解除できます）"
        : "アーカイブを解除しますか？";
      if (!confirm(msg)) return;
      const { error } = await sb.rpc("set_group_archived", { p_gid: gid, p_flag: next });
      if (error) { toast(error.message); return; }
      overlay.remove();
      route();
    }
    async function deleteGroup() {
      const r = await askForm("グループを削除",
        [{ label: `削除すると、写真・動画・コメントもすべて消えて元に戻せません。確認のため、グループ名「${group.name}」をそのまま入力してください。`, max: 40, placeholder: group.name }],
        "削除する", v => v[0] === group.name ? null : "グループ名が違います");
      if (!r) return;
      overlay.remove();
      toast("削除中…");
      try {
        // 先に写真・動画のファイルを消す（グループが消えると、他の人のファイルを消せなくなるため）
        const { data: ps, error: pe } = await sb.from("posts").select("media_path").eq("group_id", gid);
        if (pe) throw pe;
        const paths = (ps || []).map(p => p.media_path);
        for (let i = 0; i < paths.length; i += 100) {
          const { error } = await sb.storage.from("media").remove(paths.slice(i, i + 100));
          if (error) throw error;
        }
        const { data, error } = await sb.from("groups").delete().eq("id", gid).select();
        if (error || !data || !data.length) throw error || new Error("not deleted");
        toast("グループを削除しました");
        location.hash = "#/";
      } catch (e) {
        console.error(e);
        toast("削除できませんでした。もう一度試してください");
      }
    }
    async function renameGroup() {
      const r = await askForm("グループ名を変更", [{ label: "新しいグループ名", max: 40, value: group.name }], "変更");
      if (!r) return;
      const { error } = await sb.rpc("rename_group", { p_gid: gid, p_name: r[0] });
      if (error) { toast(error.message); return; }
      overlay.remove();
      toast("グループ名を変更しました");
      route();
    }
    async function removeMember(id) {
      if (!confirm(`${names[id] || "この人"} さんをグループから外しますか？\n投稿した写真は残ります。`)) return;
      const { error } = await sb.rpc("remove_member", { p_gid: gid, p_user: id });
      if (error) { toast(error.message); return; }
      memberIds.delete(id);
      toast("外しました。招待リンクで戻れるので、必要ならリンクを作り直してください");
      render();
    }
    async function leaveGroup() {
      if (!confirm(`「${group.name}」を抜けますか？\n投稿した写真は残ります。`)) return;
      const { error } = await sb.rpc("leave_group", { p_gid: gid });
      if (error) { toast(error.message); return; }
      overlay.remove();
      toast("グループを抜けました");
      location.hash = "#/";
    }
    async function resetInvite() {
      if (!confirm("招待リンクを作り直しますか？\n今までのリンクは使えなくなります。")) return;
      const { data, error } = await sb.rpc("reset_invite_link", { p_gid: gid });
      if (error) { toast(error.message); return; }
      group.invite_code = data;
      toast("招待リンクを作り直しました");
    }
    function render() {
      const addable = profiles.filter(p => !p.is_admin && friendIds.has(p.user_id) && !memberIds.has(p.user_id));
      const kids = [
        el("h2", {}, group.name),
        el("div", { class: "sub" }, `メンバー（${memberIds.size}人）`),
        el("div", { class: "rows" }, [...memberIds].map(id => el("div", { class: "rowi" },
          el("div", { class: "who2 wa" }, avatarEl(profs[id], "sm"), el("span", {}, names[id] || "?", id === group.owner_id ? el("small", {}, "　作成者") : null)),
          el("div", { class: "ops" },
            (!isGuest() && id !== me.id && profs[id] && !profs[id].is_admin && !profs[id].is_guest && !friendIds.has(id))
              ? (pendingIds.has(id)
                  ? el("small", {}, "申請中")
                  : el("button", { class: "btn ghost sm", onclick: () => friendReq(id) }, "フレンド申請"))
              : null,
            (isOwner && id !== me.id) ? el("button", { class: "btn ghost sm", onclick: () => removeMember(id) }, "外す") : null))))
      ];
      if (!archived && !isGuest()) {
        kids.push(el("div", { class: "sub", style: "margin-top:16px" }, "フレンドを追加（リンクなしで招待）"));
        kids.push(addable.length
          ? el("div", { class: "rows" }, addable.map(p => el("div", { class: "rowi" },
              el("div", { class: "who2 wa" }, avatarEl(p, "sm"), el("span", {}, p.display_name, " ", el("small", {}, "@" + p.login_id))),
              el("button", { class: "btn sm", onclick: () => addFriend(p) }, "追加"))))
          : el("p", { class: "note" }, "追加できるフレンドがいません。", el("a", { href: "#/friends", style: "color:var(--accent);font-weight:700", onclick: () => overlay.remove() }, "フレンド画面で申請する")));
        kids.push(el("button", { class: "btn ghost big", onclick: () => inviteShare(group) }, "🔗 招待リンクを共有"));
      }
      if (isOwner) {
        kids.push(el("button", { class: "btn ghost big", onclick: renameGroup }, "✏ グループ名を変更する"));
        if (!archived) kids.push(el("button", { class: "btn ghost big", onclick: resetInvite }, "🔗 招待リンクを作り直す"));
        kids.push(el("button", { class: "btn ghost big", onclick: toggleArchive }, archived ? "アーカイブを解除する" : "🗄 このグループをアーカイブする"));
      } else {
        kids.push(el("button", { class: "btn ghost big", onclick: leaveGroup }, "グループを抜ける"));
        if (!isGuest()) kids.push(el("button", { class: "btn ghost big", onclick: rejectGroup }, "🚫 拒否して抜ける（二度と追加されない）"));
      }
      if (isOwner) kids.push(el("button", { class: "btn danger big", onclick: deleteGroup }, "🗑 このグループを削除する"));
      kids.push(el("button", { class: "btn big", onclick: () => overlay.remove() }, "閉じる"));
      body.replaceChildren(...kids);
    }
    render();
    overlay = el("div", { class: "overlay", onclick: e => { if (e.target === overlay) overlay.remove(); } }, body);
    document.body.append(overlay);
  }

  root.append(
    topbar(group.name, {
      back: true,
      actions: [
        el("button", { class: "icon", title: "更新", style: "font-size:20px", onclick: () => { loadFeed(); toast("更新しました"); } }, "↻"),
        el("button", { class: "icon", title: "メンバー", style: "font-size:20px", onclick: openMembers }, "👥")
      ]
    }),
    el("main", { class: "wrap" },
      isGuest() ? el("div", { class: "banner" }, "ゲストで参加中です。撮ることと見ることができます。") : null,
      archived ? el("div", { class: "banner" }, "🗄 このグループはアーカイブ済みです。見るのと保存だけできます。", el("br"), "削除はグループを作った人だけができます。") : null,
      feed),
    ...(archived ? [] : [el("button", { class: "fab", title: "撮影", onclick: () => openCamera(gid, loadFeed) }, "📷")])
  );
  await loadFeed();
  return loadFeed;
}

function postCard(p, initialComments, url, ctx) {
  const { names, isOwner, archived, reload } = ctx;
  const profs = ctx.profs || {};
  const mine = p.user_id === me.id;
  const canDelete = isOwner || (mine && !archived);
  const who = (p.user_id && names[p.user_id]) || (p.user_id ? "退出したメンバー" : "削除されたユーザー");
  const list = [...initialComments];
  const media = p.media_type === "video"
    ? el("video", { src: url ? url + "#t=0.1" : "", controls: true, playsinline: true, preload: "metadata" })
    : el("img", { src: url || "", loading: "lazy", alt: "" });

  const clist = el("div", { class: "comments" });
  const countEl = el("span", {}, "");
  const canDelComment = c => isOwner || (c.user_id === me.id && !archived);
  function renderComments() {
    clist.replaceChildren(...list.map(c => el("div", { class: "cm" },
      el("b", {}, (c.user_id && names[c.user_id]) || (c.user_id ? "退出したメンバー" : "削除されたユーザー")),
      c.body,
      canDelComment(c) ? el("button", { class: "x", onclick: () => delComment(c) }, "×") : null)));
    countEl.textContent = list.length ? String(list.length) : "";
  }
  async function delComment(c) {
    const { data, error } = await sb.from("comments").delete().eq("id", c.id).select();
    if (error || !data || !data.length) { toast("削除できませんでした"); return; }
    list.splice(list.findIndex(x => x.id === c.id), 1);
    renderComments();
  }
  const inp = el("input", { type: "text", maxlength: 300, placeholder: "コメントを書く…" });
  const cform = (archived || ctx.guest) ? null : el("form", {
    class: "cform",
    onsubmit: async e => {
      e.preventDefault();
      const body = inp.value.trim();
      if (!body) return;
      inp.value = "";
      const { data, error } = await sb.from("comments").insert({ post_id: p.id, group_id: p.group_id, body }).select().single();
      if (error) { console.error(error); toast("送れませんでした"); inp.value = body; return; }
      list.push(data);
      renderComments();
    }
  }, inp, el("button", { class: "send", type: "submit" }, "送信"));

  async function del() {
    if (!confirm("この投稿を削除しますか？")) return;
    const { data, error } = await sb.from("posts").delete().eq("id", p.id).select();
    if (error || !data || !data.length) { toast("削除できませんでした"); return; }
    await sb.storage.from("media").remove([p.media_path]);
    toast("削除しました");
    reload();
  }

  renderComments();
  return el("article", { class: "post" },
    el("div", { class: "phead" }, avatarEl(profs[p.user_id] || { display_name: who }), el("span", { class: "who" }, who)),
    el("div", { class: "polaroid" },
      el("div", { class: "media" }, media),
      el("div", { class: "cap" }, fmt(p.taken_at), p.media_type === "video" ? el("span", { class: "vbadge" }, "🎬") : null)),
    el("div", { class: "pact" },
      el("span", {}, "💬 ", countEl),
      el("span", { class: "sp" }),
      el("button", { onclick: () => savePost(p, url, who) }, "⬇ 保存"),
      canDelete ? el("button", { onclick: del }, "🗑 削除") : null,
      !mine ? el("button", { onclick: () => openReport(p) }, "🚩 通報") : null),
    clist, cform);
}

// ====== 通報 ======
function openReport(p) {
  const reasons = ["不適切な写真・動画", "自分が写っていて困る", "迷惑・いやがらせ", "その他"];
  let reason = "", overlay;
  const note = el("input", { type: "text", maxlength: 100, placeholder: "くわしく（なくてもOK）" });
  const btns = reasons.map(r => {
    const b = el("button", {
      type: "button", class: "btn ghost", style: "width:100%;margin-top:8px",
      onclick: () => { reason = r; btns.forEach(x => x.classList.remove("sel")); b.classList.add("sel"); }
    }, r);
    return b;
  });
  const send = el("button", {
    class: "btn", type: "button",
    onclick: async () => {
      if (!reason) { toast("理由を選んでください"); return; }
      send.disabled = true;
      const text = note.value.trim() ? `${reason}：${note.value.trim()}` : reason;
      const { error } = await sb.rpc("report_post", { p_post_id: p.id, p_reason: text });
      if (error) { toast(error.message); send.disabled = false; return; }
      overlay.remove();
      toast("通報しました。管理者が確認します");
    }
  }, "通報する");
  overlay = el("div", { class: "overlay", onclick: e => { if (e.target === overlay) overlay.remove(); } },
    el("div", { class: "modal" },
      el("h2", {}, "この投稿を通報"),
      el("div", { class: "sub" }, "理由を選んでください。通報は管理者だけに届き、投稿した人には分かりません。"),
      btns,
      el("label", {}, "ひとこと", note),
      el("div", { class: "row" },
        el("button", { type: "button", class: "btn ghost", onclick: () => overlay.remove() }, "キャンセル"),
        send)));
  document.body.append(overlay);
}

// ====== 保存 ======
async function polaroidBlob(imgBlob, takenAt, who) {
  const bmp = await createImageBitmap(imgBlob);
  const W = 1200, P = 60, S = W - P * 2, H = P + S + 240;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fffdf8"; g.fillRect(0, 0, W, H);
  g.drawImage(bmp, P, P, S, S);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "#4a4038";
  g.font = '56px "Segoe Script","Bradley Hand","Hiragino Maru Gothic ProN",cursive,sans-serif';
  g.fillText(fmt(takenAt), W / 2, P + S + 95);
  g.fillStyle = "#8a7e72";
  g.font = "36px sans-serif";
  g.fillText(who, W / 2, P + S + 170);
  return await new Promise(r => c.toBlob(r, "image/png"));
}
function downloadBlob(blob, name) {
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function askTapToSave(file) {
  return new Promise(resolve => {
    let overlay;
    const done = () => { overlay.remove(); resolve(true); };
    overlay = el("div", { class: "overlay" }, el("div", { class: "modal" },
      el("h2", {}, "準備できました"),
      el("button", {
        class: "btn big",
        onclick: async () => {
          try { await navigator.share({ files: [file] }); }
          catch (e) { if (e.name !== "AbortError") downloadBlob(file, file.name); }
          done();
        }
      }, "保存する"),
      el("button", { class: "btn ghost big", onclick: done }, "閉じる")));
    document.body.append(overlay);
  });
}
async function deliver(blob, filename) {
  const file = new File([blob], filename, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) {
      if (e.name === "AbortError") return;
      if (e.name === "NotAllowedError") { await askTapToSave(file); return; }
      console.error(e);
    }
  }
  downloadBlob(blob, filename);
}
async function savePost(p, url, who) {
  if (!url) { toast("保存できませんでした"); return; }
  toast("準備中…");
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    if (p.media_type === "photo") {
      await deliver(await polaroidBlob(blob, p.taken_at, who), `pasha_${stamp(p.taken_at)}.png`);
    } else {
      const ext = (p.media_path.split(".").pop() || "mp4").toLowerCase();
      const typed = blob.type ? blob : new Blob([blob], { type: ext === "webm" ? "video/webm" : "video/mp4" });
      await deliver(typed, `pasha_${stamp(p.taken_at)}.${ext}`);
    }
  } catch (e) { console.error(e); toast("保存できませんでした"); }
}

// ====== カメラ ======
function pickMime() {
  if (!window.MediaRecorder) return "";
  const c = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  return c.find(t => MediaRecorder.isTypeSupported(t)) || "";
}

function openCamera(gid, onPosted) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast("このブラウザではカメラが使えません（https が必要です）");
    return;
  }
  let mode = "photo", facing = "environment", stream = null, rec = null, chunks = [], timer = null, busy = false, recording = false;

  const video = el("video", { playsinline: true, muted: true, autoplay: true });
  video.muted = true;
  const timerLabel = el("div", { class: "timer", style: "display:none" }, "");
  const busyLabel = el("div", { class: "busy", style: "display:none" }, "投稿中…");
  const shutter = el("button", { class: "shutter", onclick: onShutter }, el("i"));
  const btnPhoto = el("button", { class: "on", onclick: () => setMode("photo") }, "写真");
  const btnVideo = el("button", { onclick: () => setMode("video") }, "動画");
  const flip = el("button", { onclick: () => { facing = facing === "user" ? "environment" : "user"; startStream(); } }, "🔄 切替");

  const overlay = el("div", { class: "cam" });
  overlay.replaceChildren(
    el("div", { class: "bar" }, el("button", { onclick: close }, "✕ 閉じる"), flip),
    el("div", { class: "view" }, video, timerLabel, busyLabel),
    el("div", { class: "modes" }, btnPhoto, btnVideo),
    el("div", { class: "shutter-row" }, shutter)
  );
  document.body.append(overlay);
  window.__camClose = close;
  startStream();

  function stopStream() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
  async function startStream() {
    stopStream();
    const base = { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 1280 } };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: base, audio: mode === "video" });
    } catch (e) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: base, audio: false });
        if (mode === "video") toast("マイクが使えないので音なしで撮影します");
      } catch (e2) {
        console.error(e2);
        toast("カメラを使えませんでした。ブラウザの許可を確認してください");
        close();
        return;
      }
    }
    video.srcObject = stream;
    video.classList.toggle("mirror", facing === "user");
    try { await video.play(); } catch {}
  }
  function setMode(m) {
    if (recording || busy || m === mode) return;
    mode = m;
    btnPhoto.className = m === "photo" ? "on" : "";
    btnVideo.className = m === "video" ? "on" : "";
    shutter.className = "shutter" + (m === "video" ? " video" : "");
    startStream();
  }
  function setBusy(b) {
    busy = b;
    busyLabel.style.display = b ? "flex" : "none";
    shutter.disabled = b;
  }
  function close() {
    clearInterval(timer);
    try { if (rec && rec.state !== "inactive") { rec.onstop = null; rec.stop(); } } catch {}
    stopStream();
    overlay.remove();
    window.__camClose = null;
  }

  async function upload(blob, type, takenAt, ext) {
    setBusy(true);
    try {
      const path = `${gid}/${crypto.randomUUID()}.${ext}`;
      const { error: ue } = await sb.storage.from("media").upload(path, blob, { contentType: blob.type, cacheControl: "3600" });
      if (ue) throw ue;
      const { error: pe } = await sb.from("posts").insert({ group_id: gid, media_path: path, media_type: type, taken_at: takenAt.toISOString() });
      if (pe) { await sb.storage.from("media").remove([path]); throw pe; }
      toast("投稿しました ✨");
      onPosted();
    } catch (e) {
      console.error(e);
      toast("投稿に失敗しました");
    } finally {
      setBusy(false);
    }
  }

  async function onShutter() {
    if (busy) return;
    if (mode === "photo") {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw) return;
      const s = Math.min(vw, vh), out = Math.min(s, 1080);
      const c = document.createElement("canvas");
      c.width = c.height = out;
      c.getContext("2d").drawImage(video, (vw - s) / 2, (vh - s) / 2, s, s, 0, 0, out, out);
      const takenAt = new Date();
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
      await upload(blob, "photo", takenAt, "jpg");
    } else if (!recording) {
      startRec();
    } else {
      stopRec();
    }
  }
  function startRec() {
    if (!window.MediaRecorder || !stream) { toast("このブラウザでは動画を撮れません"); return; }
    const mime = pickMime();
    try {
      rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 2000000 } : { videoBitsPerSecond: 2000000 });
    } catch (e) { console.error(e); toast("動画を開始できませんでした"); return; }
    chunks = [];
    const startedAt = new Date();
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      clearInterval(timer);
      recording = false;
      timerLabel.style.display = "none";
      shutter.classList.remove("rec");
      const type = ((rec && rec.mimeType) || mime || "video/mp4").split(";")[0];
      const ext = type.includes("mp4") ? "mp4" : "webm";
      const blob = new Blob(chunks, { type });
      if (blob.size) await upload(blob, "video", startedAt, ext);
    };
    rec.start();
    recording = true;
    shutter.classList.add("rec");
    let left = MAX_VIDEO_SEC;
    timerLabel.style.display = "block";
    timerLabel.textContent = `● 0:${String(left).padStart(2, "0")}`;
    timer = setInterval(() => {
      left--;
      timerLabel.textContent = `● 0:${String(Math.max(left, 0)).padStart(2, "0")}`;
      if (left <= 0) stopRec();
    }, 1000);
  }
  function stopRec() {
    clearInterval(timer);
    if (rec && rec.state !== "inactive") rec.stop();
  }
}

// ====== 起動 ======
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(() => { if (configured) loadSession().then(ok => { if (ok && profile && !profile.is_admin) syncPush(); }).catch(() => {}); }).catch(() => {});
  });
}
maybeLock();
route();
